name: Distribute upstream Docker images

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: upstream-images
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.upstream.outputs.matrix }}
      image: ${{ steps.upstream.outputs.image }}
    steps:
      - name: Resolve upstream release and master
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          upstream=zhaojh329/rttys
          tag=$(gh api "repos/$upstream/releases/latest" --jq '.tag_name')
          version=${tag#v}
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unsupported stable release tag: $tag"
            exit 1
          fi
          stable_sha=$(gh api "repos/$upstream/commits/$tag" --jq '.sha')
          edge_sha=$(gh api "repos/$upstream/commits/master" --jq '.sha')
          matrix=$(jq -cn \
            --arg stable "$stable_sha" --arg edge "$edge_sha" --arg version "$version" \
            '{include: [
              {channel: "latest", sha: $stable, version: $version},
              {channel: "edge", sha: $edge, version: ("edge-" + $edge)}
            ]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Check out exact upstream commit
        uses: actions/checkout@v4
        with:
          repository: zhaojh329/rttys
          ref: ${{ matrix.sha }}
          path: source
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish amd64 and arm64 images
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./source
          file: ./source/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.resolve.outputs.image }}:${{ matrix.channel }}
            ${{ needs.resolve.outputs.image }}:${{ matrix.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ matrix.sha }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=${{ matrix.channel }}
          cache-to: type=gha,mode=max,scope=${{ matrix.channel }}

      - name: Verify published platforms
        env:
          IMAGE: ${{ needs.resolve.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          CHANNEL: ${{ matrix.channel }}
          VERSION: ${{ matrix.version }}
          UPSTREAM_SHA: ${{ matrix.sha }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE@$DIGEST" --raw |
            jq -e '
              [.manifests[].platform | "\(.os)/\(.architecture)"] |
              index("linux/amd64") != null and index("linux/arm64") != null
            '
          {
            echo "### Published $CHANNEL"
            echo "- Image: \`$IMAGE:$CHANNEL\`"
            echo "- Version tag: \`$IMAGE:$VERSION\`"
            echo "- Upstream commit: \`$UPSTREAM_SHA\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Platforms: linux/amd64, linux/arm64"
          } >> "$GITHUB_STEP_SUMMARY"
